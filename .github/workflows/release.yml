name: Release

# Publishes the SDK to npm when a version tag (vX.Y.Z) is pushed, using
# npm Trusted Publishing (OIDC) — no token or secret required.
# One-time setup by the maintainer: on npmjs.com, open the
# open-news-protocol package -> Settings -> Trusted Publisher, and add
# this repository (CheckonNL/open-news-protocol) with the workflow
# `release.yml`. Then, to release: bump sdk/reference-impl/package.json,
# commit, and push a matching tag, e.g.
# `git tag v0.3.1 && git push origin v0.3.1`.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for npm provenance (verifiable build origin)

jobs:
  publish:
    name: "Publish open-news-protocol to npm"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/reference-impl
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdk/reference-impl/package-lock.json
      # Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 22 ships
      # an older npm, so upgrade before publishing.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      # Never publish a broken build: the full suite must pass first.
      - run: npm test
      # Guard: the pushed tag (vX.Y.Z) must match package.json's version,
      # so a tag can never publish a mismatched version.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME (=$TAG) does not match package version $PKG"
            exit 1
          fi
          echo "Publishing version $PKG"
      # Trusted Publishing: npm authenticates via OIDC (no token/secret)
      # and generates provenance automatically — a verifiable link from
      # the published package back to this workflow run and commit.
      - run: npm publish --access public
