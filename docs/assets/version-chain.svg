<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ONP version chain</title>
  <desc id="d">One identifier, many signed versions. Each version names the one it supersedes, and a retraction is a signed version too — never a deletion.</desc>

  <rect width="880" height="470" fill="#f6f7f9"/>

  <text x="40" y="46" font-size="13" font-weight="600" letter-spacing="1.6" fill="#165eb4">ONP-0006 · VERSIONS AND LIFECYCLE</text>
  <line x1="40" y1="60" x2="840" y2="60" stroke="#dde3ea"/>

  <!-- the constant identifier -->
  <rect x="40" y="84" width="800" height="42" fill="#ffffff" stroke="#dde3ea"/>
  <text x="58" y="104" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#8a9bad">OID — fixed at first signing, unchanged for the life of the story</text>
  <text x="58" y="120" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#092137">onp:oid:regiopurmerend.nl:wheermolen-bommenonderzoek</text>

  <!-- three versions -->
  <g>
    <rect x="40" y="160" width="230" height="132" fill="#ffffff" stroke="#dde3ea"/>
    <text x="58" y="184" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#165eb4">VERSION 1 · PUBLISHED</text>
    <text x="58" y="208" font-size="13.5" font-weight="600" fill="#092137">First publication</text>
    <text x="58" y="230" font-size="12" fill="#56687e">signed_at 09:15</text>
    <text x="58" y="252" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#8a9bad">vid …q9LZfGB6</text>
    <text x="58" y="274" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#c3ccd6">supersedes: —</text>

    <rect x="325" y="160" width="230" height="132" fill="#ffffff" stroke="#dde3ea"/>
    <text x="343" y="184" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#165eb4">VERSION 2 · PUBLISHED</text>
    <text x="343" y="208" font-size="13.5" font-weight="600" fill="#092137">Correction</text>
    <text x="343" y="230" font-size="12" fill="#56687e">signed_at 14:02</text>
    <text x="343" y="252" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#8a9bad">vid …Kf3Tn0Wq</text>
    <text x="343" y="274" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#165eb4">supersedes …q9LZfGB6</text>

    <rect x="610" y="160" width="230" height="132" fill="#ffffff" stroke="#b23a32"/>
    <text x="628" y="184" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#b23a32">VERSION 3 · RETRACTED</text>
    <text x="628" y="208" font-size="13.5" font-weight="600" fill="#092137">Tombstone</text>
    <text x="628" y="230" font-size="12" fill="#56687e">lifecycle_state: retracted</text>
    <text x="628" y="252" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#8a9bad">vid …Ym8bR2Lx</text>
    <text x="628" y="274" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#165eb4">supersedes …Kf3Tn0Wq</text>
  </g>

  <path d="M270 226 L318 226" stroke="#165eb4" stroke-width="1.4" marker-end="url(#b)"/>
  <path d="M555 226 L603 226" stroke="#165eb4" stroke-width="1.4" marker-end="url(#b)"/>

  <text x="40" y="322" font-size="12" fill="#8a9bad">Each version is signed independently. The chain points backwards, so a reader holding any version can walk to the ones before it.</text>

  <line x1="40" y1="348" x2="840" y2="348" stroke="#dde3ea"/>

  <text x="40" y="376" font-size="13" font-weight="600" fill="#092137">Why a retraction is a version, not a deletion</text>
  <text x="40" y="399" font-size="12.5" fill="#56687e">Removing the file would only make the article unreachable at one address — every copy already in circulation would stay unmarked.</text>
  <text x="40" y="418" font-size="12.5" fill="#56687e">A signed tombstone travels the same channels as the article did, so anyone who holds an old copy can find out it was withdrawn.</text>
  <text x="40" y="443" font-size="12.5" fill="#56687e">An HTTP 404 therefore never means “retracted” — retraction is stated inside the signed object, and only there.</text>

  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#165eb4"/>
    </marker>
  </defs>
</svg>
